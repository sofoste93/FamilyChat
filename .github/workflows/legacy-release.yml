name: Console v1 release

on:
  push:
    tags: ['v1.*']

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test and package
        run: mvn -B clean verify
      - name: Smoke test launcher
        run: java -jar target/family-chat-console-1.1.0.jar --version
      - name: Prepare checksums
        run: cd target && sha256sum family-chat-console-1.1.0.jar > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" target/family-chat-console-1.1.0.jar target/SHA256SUMS.txt --verify-tag --title "FamilyChat 1.1.0 — Restored Console" --notes-file CHANGELOG.md

